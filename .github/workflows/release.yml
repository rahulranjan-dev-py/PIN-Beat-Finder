name: Release

# Publishes a GitHub Release with an installable APK.
# Trigger either by pushing a tag (v0.1.0) or manually from the Actions tab with a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.1.0 (created if it does not exist)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        # Debug-signed so it installs on any device without a keystore. A Play-Store build
        # needs a signing config wired into the release build type (see README > Releases).
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/pin-beat-finder-${{ steps.v.outputs.tag }}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: PIN Beat Finder ${{ steps.v.outputs.tag }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
