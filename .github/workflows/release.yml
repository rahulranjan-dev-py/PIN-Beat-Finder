name: Release

# Publishes a GitHub Release with installable artifacts.
# Trigger either by pushing a tag (v0.1.0) or manually from the Actions tab with a version.
#
# Signed builds need four repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64   base64 of the .jks file      (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias inside the keystore
#   KEY_PASSWORD      key password (omit if identical to the keystore password)
# Without them the workflow still publishes a debug-signed APK and marks the release as a
# pre-release regardless of the input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.1.0 (created if it does not exist)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
      notes_only:
        description: "Only refresh the release notes of an existing release (no build, files untouched)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and signing mode
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"; pre="true"
          else
            tag="${{ inputs.version }}"; pre="${{ inputs.prerelease }}"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            signed="true"
          else
            signed="false"; pre="true"
            echo "::warning::No KEYSTORE_BASE64 secret; publishing a debug-signed APK as a pre-release."
          fi
          echo "tag=$tag"          >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre"   >> "$GITHUB_OUTPUT"
          echo "signed=$signed"    >> "$GITHUB_OUTPUT"

      - name: Release notes (short, from this version's CHANGELOG section)
        run: |
          mkdir -p dist
          python3 scripts/release_notes.py "${{ steps.v.outputs.tag }}" CHANGELOG.md > dist/NOTES.md
          cat dist/NOTES.md

      - uses: actions/setup-java@v4
        if: inputs.notes_only != true
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: inputs.notes_only != true

      - name: Unit tests
        if: inputs.notes_only != true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode release keystore
        if: inputs.notes_only != true && steps.v.outputs.signed == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -di > "$RUNNER_TEMP/release.jks"

      # Fails early with a readable reason (truncated file, wrong password, wrong alias) instead
      # of Gradle's "Failed to read key ... : null" deep inside packageRelease.
      - name: Verify keystore, password and alias
        if: inputs.notes_only != true && steps.v.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          f="$RUNNER_TEMP/release.jks"
          echo "Decoded keystore: $(stat -c %s "$f") bytes (a fresh keytool RSA-2048 store is roughly 2.5-3 KB)."
          if [ "$(stat -c %s "$f")" -lt 1000 ]; then
            echo "::error::Keystore file is too small: the KEYSTORE_BASE64 secret is probably incomplete (copied only part of the base64 text)."; exit 1
          fi
          if ! keytool -list -keystore "$f" -storepass "$KEYSTORE_PASSWORD" >/tmp/kt.txt 2>&1; then
            echo "::error::Could not open the keystore. keytool said: $(tail -1 /tmp/kt.txt). Either KEYSTORE_BASE64 is incomplete/corrupted or KEYSTORE_PASSWORD is wrong."; exit 1
          fi
          if ! keytool -list -keystore "$f" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore opened, but it has no key named '$KEY_ALIAS'. Aliases present:"; grep -i "PrivateKeyEntry\|SecretKeyEntry" /tmp/kt.txt || cat /tmp/kt.txt; exit 1
          fi
          echo "Keystore OK: alias '$KEY_ALIAS' found."

      - name: Build signed release APK and AAB
        if: inputs.notes_only != true && steps.v.outputs.signed == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/pin-beat-finder-${{ steps.v.outputs.tag }}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/pin-beat-finder-${{ steps.v.outputs.tag }}-release.aab"

      - name: Build debug-signed APK (no keystore configured)
        if: inputs.notes_only != true && steps.v.outputs.signed != 'true'
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/pin-beat-finder-${{ steps.v.outputs.tag }}-debug.apk"

      - name: Checksums
        if: inputs.notes_only != true
        run: (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        if: inputs.notes_only != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: PIN Beat Finder ${{ steps.v.outputs.tag }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          body_path: dist/NOTES.md
          generate_release_notes: false
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt

      # Rewrites only the notes of an existing release; assets and pre-release flag stay as they are.
      - name: Refresh release notes
        if: inputs.notes_only == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: PIN Beat Finder ${{ steps.v.outputs.tag }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          body_path: dist/NOTES.md
          generate_release_notes: false
